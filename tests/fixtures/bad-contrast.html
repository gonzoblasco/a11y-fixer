<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bad Contrast</title>
  <style>
    .low-contrast {
      color: #cccccc;
      background-color: #ffffff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Low Contrast Page</h1>
    <p class="low-contrast">This text has a contrast ratio of about 1.5:1 against white background.</p>
    <button class="low-contrast" style="background-color: #e0e0e0; color: #ffffff;">Submit</button>
  </main>
</body>
</html>
