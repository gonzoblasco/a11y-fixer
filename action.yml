name: 'a11y-fixer'
description: 'Accessibility audit bot for GitHub PRs. Scans pages with axe-core and posts structured feedback.'
author: 'gonzoblasco'

inputs:
  github_token:
    description: 'GitHub token for posting comments and setting check statuses'
    required: true
  config_path:
    description: 'Path to .a11y-fixer.yml configuration file'
    required: false
    default: '.a11y-fixer.yml'

runs:
  using: 'node20'
  main: 'dist/action.js'
