name: 'a11y-fixer'
description: 'Accessibility audit bot for GitHub PRs. Scans pages with axe-core via Playwright and posts structured feedback.'
author: 'gonzoblasco'
branding:
  icon: 'eye'
  color: 'green'

inputs:
  github_token:
    description: 'GitHub token for posting comments and setting check statuses'
    required: true
  config:
    description: 'Path to .a11y-fixer.yml configuration file'
    required: false
    default: '.a11y-fixer.yml'
  target_url:
    description: 'Base URL of the app to audit (e.g. http://localhost:3000 or http://host.docker.internal:3000)'
    required: false
    default: 'http://localhost:3000'

runs:
  using: 'docker'
  image: 'Dockerfile'